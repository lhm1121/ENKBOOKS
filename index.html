<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENK Books 이엔케이북스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 여백을 넉넉히 둔 잡지형 구성. 짙은 잉크색 바탕 위 얇은 금색 선 하나로 포인트, 제목은 명조, 본문은 산세리프 */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --ink:#14231b; --muted:#5f6f64; --line:#dde5dc;
  --accent:#1f5a3e; --gold:#8cbf3f; --chip:#e6eee3; --deep:#14231b; --deep-fg:#eef3ec; --deep-muted:#a3b3a8;
  --mark:var(--gold); --mark-soft:#e6eee3;
  --c1:#1f5a3e; --c2:#2e7d5b; --c3:#4a6b2a; --c4:#16423a; --c5:#6b8f3a; --c6:#355e4a;
  --display:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --latin:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1612; --surface:#151e18; --ink:#e8efe9; --muted:#9aaa9f; --line:#26332b;
  --accent:#8fd1a8; --gold:#a6d65a; --chip:#1c2820; --deep:#0a100c; --deep-fg:#e8efe9; --deep-muted:#8d9c92;
  --mark-soft:#1c2820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1612; --surface:#151e18; --ink:#e8efe9; --muted:#9aaa9f; --line:#26332b;
  --accent:#8fd1a8; --gold:#a6d65a; --chip:#1c2820; --deep:#0a100c; --deep-fg:#e8efe9; --deep-muted:#8d9c92;
  --mark-soft:#1c2820; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;font-weight:400;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0;font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{color:var(--accent);text-decoration:underline 1px var(--gold);text-underline-offset:.22em}
button,.btn{font:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:32px;padding-block:18px}
.logo{display:flex;align-items:center;text-decoration:none}
.wm{display:inline-flex;align-items:center;gap:10px;font-family:var(--latin);line-height:1;white-space:nowrap}
.wm strong{font-size:22px;font-weight:800;letter-spacing:.06em}
.wm i{width:1px;height:16px;background:currentColor;opacity:.35}
.wm span{font-size:13px;font-weight:400;letter-spacing:.42em;margin-right:-.42em}
.logo .wm strong{color:var(--accent)}
.flogo{display:block!important;margin-bottom:12px}
.flogo .wm{color:var(--deep-fg)}
nav{display:flex;gap:28px;flex-wrap:wrap;margin-left:auto}
nav a{text-decoration:none;padding:4px 0;font-size:14px;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-color:var(--gold)}
.cart-btn{border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 0 4px 24px;white-space:nowrap;font-size:14px;letter-spacing:.04em}
.cart-btn em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold);margin-left:6px}
@media (max-width:760px){.topbar{flex-wrap:wrap;gap:10px 20px;padding-block:14px}nav{order:3;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:22px}.cart-btn{margin-left:auto;border:0;padding-left:0}}

main{padding-block:56px 96px;min-height:60vh}
section+section{margin-top:96px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sec-head h2{font-family:var(--display);font-size:clamp(22px,2.4vw,28px);font-weight:700;letter-spacing:-.03em}
.sec-head a{font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:.04em}
.sec-head a::after{content:" →"}
.sec-head a:hover{color:var(--ink)}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--latin);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);margin-bottom:6px}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--gold)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center;padding-block:24px 16px}
.hero h1{font-family:var(--display);font-size:clamp(30px,4.2vw,52px);font-weight:700;letter-spacing:-.04em;line-height:1.3;margin-top:18px}
.hero p{color:var(--muted);max-width:30em;margin:28px 0 36px;font-size:16px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:2px;padding:13px 26px;font-size:14px;font-weight:500;letter-spacing:.06em;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.hero-stack{position:relative;height:420px}
.hero-stack::before{content:"";position:absolute;inset:8% 0 0 12%;background:var(--chip)}
.hero-stack .cover{position:absolute;width:42%;box-shadow:0 30px 50px -20px rgb(0 0 0 / .35)}
.hero-stack .cover:nth-child(1){left:6%;top:70px}
.hero-stack .cover:nth-child(2){left:31%;top:24px;z-index:2}
.hero-stack .cover:nth-child(3){left:56%;top:96px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:40px}.hero-stack{height:300px;max-width:440px}}

/* quick menu: 분야 목록 */
.quick{display:grid;grid-template-columns:repeat(4,1fr);margin-top:72px;border-block:1px solid var(--line)}
.quick a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:22px 24px;text-decoration:none;border-left:1px solid var(--line);transition:background .2s}
.quick a:first-child{border-left:0}
.quick a b{font-family:var(--display);font-size:17px;font-weight:600}
.quick a span{font-family:var(--mono);font-size:12px;color:var(--gold)}
.quick a:hover{background:var(--surface)}
@media (max-width:760px){.quick{grid-template-columns:repeat(2,1fr)}.quick a:nth-child(3){border-left:0}.quick a:nth-child(n+3){border-top:1px solid var(--line)}}

.quick + section{margin-top:88px}

/* covers (임시 표지) */
.cover{aspect-ratio:3/4;max-width:100%;border-radius:1px 3px 3px 1px;background:var(--cc);color:#f3efe6;padding:14% 12% 12% 16%;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5%;background:linear-gradient(90deg,rgb(0 0 0 / .28),rgb(255 255 255 / .06))}
.cover::after{content:"";position:absolute;inset:7% 7% 7% 11%;border:1px solid rgb(201 169 110 / .55);pointer-events:none}
.cover small{font-size:clamp(8px,1vw,10px);letter-spacing:.18em;color:#c9a96e;position:relative}
.cover strong{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.9vw,21px);line-height:1.3;position:relative;letter-spacing:-.01em}
.cover .pub{font-family:var(--latin);letter-spacing:.08em;font-size:clamp(10px,1.1vw,13px);opacity:.75;position:relative}

/* book grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:48px 28px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:16px}
.card .cover{box-shadow:0 18px 30px -18px rgb(0 0 0 / .45);transition:box-shadow .3s,transform .3s}
.card:hover .cover{box-shadow:0 26px 40px -18px rgb(0 0 0 / .5);transform:translateY(-3px)}
.card h3{font-family:var(--display);font-size:16px;font-weight:600}
.card .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:0;letter-spacing:.08em;color:var(--muted);font-weight:500}
.tag.new{color:var(--gold)}
.tag.new::before{content:"— "}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:32px 16px}}

/* catalog */
.stages{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.stages button{border:0;background:transparent;padding:10px 18px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stages button.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.catalog{display:grid;grid-template-columns:190px 1fr;gap:48px}
.filters{display:flex;flex-direction:column;gap:2px;position:sticky;top:100px;align-self:start}
.filters button{text-align:left;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 16px;font-size:14px}
.filters button.on{color:var(--ink);border-color:var(--gold);font-weight:600}
.filters button:hover{color:var(--ink)}
.toolbar{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{font:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface);color:var(--ink)}
.toolbar input{flex:1;min-width:0}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
@media (max-width:760px){.catalog{grid-template-columns:1fr;gap:24px}.filters{position:static;flex-direction:row;overflow-x:auto;gap:0}.filters button{white-space:nowrap;border-left:0;border-bottom:1px solid var(--line)}}

/* detail */
.detail{display:grid;grid-template-columns:340px 1fr;gap:72px;margin-top:24px}
.detail .cover{width:100%;box-shadow:0 30px 50px -24px rgb(0 0 0 / .45)}
.detail h1{font-family:var(--display);font-size:clamp(28px,3.4vw,40px);font-weight:600;letter-spacing:-.02em;margin:12px 0 6px}
.detail .sub{color:var(--muted);margin-bottom:28px;font-size:16px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:10px 28px;font-size:14px;padding:20px 0;border-block:1px solid var(--line);margin:0 0 28px}
.spec dt{color:var(--muted);letter-spacing:.04em}
.spec dd{margin:0;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.price{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
.price b{font-family:var(--display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.price s{color:var(--muted)}
.buy{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stores{display:flex;gap:0;flex-wrap:wrap;font-size:13px;margin-top:20px;border:1px solid var(--line);width:fit-content;max-width:100%}
.stores a{padding:10px 18px;text-decoration:none;letter-spacing:.04em;border-left:1px solid var(--line)}
.stores a:first-child{border-left:0}
.stores a:hover{background:var(--surface)}
.note{font-size:13px;color:var(--muted)}
.note a{text-decoration:none}
.tabs{display:flex;gap:32px;border-bottom:1px solid var(--line);margin:72px 0 32px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 0;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:15px}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--gold)}
.prose{max-width:62ch;font-size:16px}
.prose ul,.prose ol{padding-left:0;list-style:none}
.toc li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
@media (max-width:860px){.detail{grid-template-columns:1fr;gap:32px}.detail .cover{max-width:260px}}

/* resources table */
.table-wrap{overflow-x:auto;border-top:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:16px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500}
td a{text-decoration:none;font-family:var(--display);font-weight:600}
td.num{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:12px}
.ftype{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.06em}
.dl{border:1px solid var(--ink);color:var(--ink);background:transparent;border-radius:2px;padding:6px 14px;font-size:12px;letter-spacing:.06em;white-space:nowrap;text-decoration:none}
.dl[disabled]{border-color:var(--line);color:var(--muted);cursor:not-allowed}
.lock{font-size:12px;color:var(--muted);white-space:nowrap}

/* boards */
.board{list-style:none;padding:0;margin:0}
.board li{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline;flex-wrap:wrap}
.board li b{font-weight:400;flex:1;min-width:0}
.board time{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.board .tag{margin-right:6px;color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media (max-width:760px){.two{grid-template-columns:1fr;gap:56px}}
h3{font-family:var(--display);font-size:20px}

.panel{border:1px solid var(--line);background:var(--surface);padding:clamp(24px,4vw,48px)}
.form{display:grid;gap:16px;max-width:560px}
.form label{display:grid;gap:6px;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:2px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

footer{background:var(--deep);color:var(--deep-muted);padding-block:56px;font-size:13px;line-height:1.9}
footer .wrap{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}
footer b{color:var(--deep-fg);font-family:var(--latin);font-size:22px;font-weight:700;letter-spacing:-.02em;display:block;margin-bottom:8px}
footer a{color:var(--deep-fg)}
/* ---- 메인 레이아웃 (큰 출판사형) ---- */
body{overflow-x:clip}
.band{margin-inline:calc(50% - 50vw);width:100vw}
main > section.band:first-child{margin-top:-56px}
.band-hero{background:var(--deep);color:var(--deep-fg);padding-block:64px 40px}
.band-hero .eyebrow{color:var(--gold)}
.band-hero .eyebrow::before{background:var(--gold)}
.slides{position:relative;min-height:400px}
.slide{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center;position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s}
.slide.on{position:relative;opacity:1;visibility:visible}
.slide h1{font-size:clamp(30px,4.4vw,54px);font-weight:700;letter-spacing:-.04em;line-height:1.25;margin-top:16px}
.slide p{color:var(--deep-muted);max-width:32em;margin:22px 0 32px;font-size:16px}
.slide-cover{display:flex;justify-content:center}
.slide-cover .cover{width:min(280px,70%);box-shadow:0 40px 60px -24px rgb(0 0 0 / .6);transform:rotate(-3deg)}
.btn.light{background:var(--deep-fg);color:var(--deep);border-color:var(--deep-fg)}
.btn.light:hover{background:transparent;color:var(--deep-fg)}
.btn.ghost-light{background:transparent;color:var(--deep-fg);border-color:rgb(255 255 255 / .25)}
.btn.ghost-light:hover{border-color:var(--deep-fg)}
.dots{display:flex;gap:8px;margin-top:32px}
.dots button{width:28px;height:3px;border:0;padding:0;background:rgb(255 255 255 / .25)}
.dots button.on{background:var(--gold)}
@media (max-width:760px){.slide{grid-template-columns:1fr;gap:32px}.slide-cover{justify-content:flex-start}.slide-cover .cover{width:180px}.slides{min-height:0}}

.rail{display:grid;grid-template-columns:repeat(4,1fr);margin-top:48px;border-top:1px solid rgb(255 255 255 / .14)}
.rail a{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 12px;padding:22px 24px 4px 0;text-decoration:none;color:var(--deep-fg);position:relative}
.rail a + a{padding-left:24px;border-left:1px solid rgb(255 255 255 / .14)}
.rail a::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.rail a:hover::before{transform:scaleX(1)}
.rail small{grid-column:1/-1;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--deep-muted)}
.rail span{font-size:18px;font-weight:600;letter-spacing:-.02em}
.rail em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold)}
@media (max-width:760px){.rail{grid-template-columns:1fr 1fr}.rail a:nth-child(3){padding-left:0;border-left:0}.rail a:nth-child(n+3){border-top:1px solid rgb(255 255 255 / .14)}}

.split{display:grid;grid-template-columns:1fr 340px;gap:56px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.rank ol{list-style:none;margin:0;padding:0}
.rank li a{display:grid;grid-template-columns:28px 46px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.rk{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.rk-cover .cover{padding:8% 6%}
.rk-cover .cover small,.rk-cover .cover .pub{display:none}
.rk-cover .cover strong{display:none}
.rk-t{display:grid;min-width:0}
.rk-t b{font-weight:600;font-size:15px}
.rk-t small{font-size:12px;color:var(--muted)}
@media (max-width:960px){.split{grid-template-columns:1fr}}
@media (max-width:560px){.grid-3{grid-template-columns:repeat(2,1fr)}.grid-3 .card:nth-child(3){display:none}}

.series{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.serie{display:grid;gap:20px;padding:28px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .2s}
.serie:hover{border-color:var(--accent)}
.serie-covers{display:flex;height:150px;align-items:flex-end}
.serie-covers .cover{width:96px;flex:none;box-shadow:0 14px 24px -14px rgb(0 0 0 / .5)}
.serie-covers .cover + .cover{margin-left:-40px}
.serie-covers .cover small,.serie-covers .cover .pub{display:none}
.serie-covers .cover strong{display:none}
.serie-text small{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.serie-text b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;margin:2px 0 6px}
.serie-text p{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:860px){.series{grid-template-columns:1fr}}

.band-teacher{background:var(--accent);color:#f4f7f2;padding-block:72px}
.band-teacher .eyebrow{color:var(--gold)}
.band-teacher .eyebrow::before{background:var(--gold)}
.teacher{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center}
.teacher h2{font-size:clamp(24px,3vw,36px);font-weight:700;letter-spacing:-.03em;margin-top:12px}
.teacher p{color:rgb(244 247 242 / .75);margin:16px 0 28px;max-width:34em}
.teacher .btn.light{background:#f4f7f2;color:var(--accent);border-color:#f4f7f2}
.teacher .btn.light:hover{background:transparent;color:#f4f7f2}
.teacher .btn.ghost-light{color:#f4f7f2}
.teacher-list{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid rgb(255 255 255 / .2)}
.teacher-list li{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid rgb(255 255 255 / .2)}
.teacher-list .ftype{color:var(--gold);width:40px}
@media (max-width:760px){.teacher{grid-template-columns:1fr;gap:32px}}

.three{display:grid;grid-template-columns:repeat(3,1fr);gap:48px}

          <div class="hero-actions"><a class="btn light" href="#resources">자료실 가기</a><a class="btn ghost-light" href="#support">교사 인증 안내</a></div>
        </div>
        <ul class="teacher-list">
          ${[["MP3","음원 · 듣기 파일"],["PDF","정답과 해설 · 단어 시험지"],["HWP","유닛별 변형 문제"],["PPT","수업용 슬라이드"]].map(([t,d])=>`<li><span class="ftype">${t}</span>${d}</li>`).join("")}
        </ul>
      </div>
    </section>

    <section class="three">
      <div><div class="sec-head"><h2>자료실 새 소식</h2><a href="#resources">더 보기</a></div>
        <ul class="board">${lastRes.map(r=>`<li><b><span class="tag">${esc(r.book.title)}</span> ${esc(r.name)}</b><span class="ftype">${r.type}</span></li>`).join("")}</ul></div>
      <div><div class="sec-head"><h2>공지사항</h2><a href="#support">더 보기</a></div>${board(NOTICES)}</div>
      <div><div class="sec-head"><h2>정오표</h2><a href="#support">더 보기</a></div>${board(ERRATA,true)}</div>
    </section>`;
  },

  books(){
    return `
    <div class="sec-head"><div><div class="eyebrow">Books</div><h2>교재 목록</h2></div></div>
    <div class="catalog">
      <div class="filters" id="filters">${["전체",...SITE.categories].map(c=>`<button type="button" data-c="${esc(c)}" class="${c===state.cat?'on':''}">${esc(c)}</button>`).join("")}</div>
      <div>
        <div class="stages" id="stages">${[["","전체"],...STAGES.map(x=>[x[0],x[2]])].map(([k,t])=>`<button type="button" data-s="${k}" class="${k===state.stage?'on':''}">${t}</button>`).join("")}</div>
        <div class="toolbar">
          <input id="q" type="search" placeholder="책 이름이나 ISBN으로 찾기" value="${esc(state.q)}" aria-label="교재 검색">
          <select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="title">가나다순</option><option value="price">가격 낮은순</option></select>
        </div>
        <div class="count" id="count"></div>
        <div class="grid" id="list" style="margin-top:12px"></div>
      </div>
    </div>`;
  },

  book(id){
    const b = BOOKS.find(x=>x.id===id);
    if(!b) return `<p>찾는 책이 없습니다. <a href="#books">교재 목록</a>으로 돌아가세요.</p>`;
    const q = encodeURIComponent(b.isbn.replace(/-/g,""));
    const shopBtns = SITE.shop.enabled
      ? `<button class="btn" type="button" data-add="${b.id}">장바구니 담기</button><button class="btn ghost" type="button" data-add="${b.id}" data-now="1">바로 구매</button>`
      : `<button class="btn" type="button" data-add="${b.id}">장바구니 담기</button>`;
    return `
    <p class="note"><a href="#books">교재</a> › ${esc(b.cat)}</p>
    <div class="detail">
      <div>${cover(b)}</div>
      <div>
        <div><span class="tag">${esc(b.cat)}</span> ${b.isNew?'<span class="tag new">신간</span>':''}</div>
        <h1>${esc(b.title)}</h1>
        <div class="sub">${esc(b.sub)}</div>
        <dl class="spec">
          <dt>대상</dt><dd>${esc(b.level)}</dd>
          <dt>발행일</dt><dd>${b.date}</dd>
          <dt>쪽수 · 판형</dt><dd>${b.pages}쪽 · ${esc(b.size)}</dd>
          <dt>ISBN</dt><dd class="mono">${esc(b.isbn)}</dd>
        </dl>
        <div class="price"><b>${won(Math.round(b.price*0.9/10)*10)}</b><s>${won(b.price)}</s><span class="note">10% 할인</span></div>
        <div class="buy">${shopBtns}</div>
        <p class="note">${SITE.shop.enabled?'':'자체 판매는 준비 중입니다. 지금은 아래 온라인 서점에서 구매할 수 있습니다.'}</p>
        <div class="stores">
          <a href="https://search.kyobobook.co.kr/search?keyword=${q}" target="_blank" rel="noopener">교보문고</a>
          <a href="https://www.yes24.com/Product/Search?query=${q}" target="_blank" rel="noopener">YES24</a>
          <a href="https://www.aladin.co.kr/search/wsearchresult.aspx?SearchWord=${q}" target="_blank" rel="noopener">알라딘</a>
        </div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="on" data-tab="intro">책 소개</button>
      <button type="button" data-tab="toc">목차</button>
      <button type="button" data-tab="res">부가자료 ${b.resources.length}</button>
    </div>
    <div data-pane="intro" class="prose"><p>${esc(b.desc)}</p></div>
    <div data-pane="toc" class="prose" hidden><ul class="toc">${b.toc.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    <div data-pane="res" hidden>${resTable(b.resources.map(r=>({...r,book:b})), false)}</div>`;
  },

  resources(){
    const rows = BOOKS.flatMap(b=>b.resources.map(r=>({...r,book:b})));
    return `
    <div class="sec-head"><div><div class="eyebrow">Resources</div><h2>자료실</h2></div></div>
    <p class="note" style="margin:-8px 0 20px">음원, 정답·해설은 누구나 받을 수 있고, 수업용 자료는 교사 인증 회원에게 제공됩니다.</p>
    <div class="toolbar">
      <select id="rbook" aria-label="도서 선택"><option value="">전체 도서</option>${BOOKS.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join("")}</select>
      <select id="rtype" aria-label="자료 종류"><option value="">모든 종류</option>${[...new Set(rows.map(r=>r.type))].map(t=>`<option>${t}</option>`).join("")}</select>
    </div>
    <div id="rlist">${resTable(rows, true)}</div>`;
  },

  support(){
    return `
    <div class="sec-head"><div><div class="eyebrow">Support</div><h2>고객센터</h2></div></div>
    <section class="two" style="margin-top:0">
      <div><h3 style="margin-bottom:12px">공지사항</h3>${board(NOTICES)}</div>
      <div><h3 style="margin-bottom:12px">정오표</h3>${board(ERRATA,true)}</div>
    </section>
    <section>
      <h3 style="margin-bottom:12px">자주 묻는 질문</h3>
      <ul class="board">${FAQ.map(([q,a])=>`<li style="display:block"><b>Q. ${esc(q)}</b><div class="note" style="margin-top:4px">${esc(a)}</div></li>`).join("")}</ul>
    </section>
    <section>
      <div class="panel">
        <h3 style="margin-bottom:16px">문의 남기기</h3>
        <form class="form" id="ask">
          <label for="f-type">문의 종류<select id="f-type"><option>교재 내용</option><option>부가자료</option><option>단체 주문</option><option>기타</option></select></label>
          <label for="f-name">이름<input id="f-name" required></label>
          <label for="f-contact">연락처 또는 이메일<input id="f-contact" required></label>
          <label for="f-msg">내용<textarea id="f-msg" rows="4" required></textarea></label>
          <div><button class="btn" type="submit">문의 등록</button></div>
          <p class="note">미리보기 화면이라 문의는 실제로 전송되지 않습니다.</p>
        </form>
      </div>
    </section>`;
  },

  about(){
    return `
    <div class="sec-head"><div><div class="eyebrow">About</div><h2>회사소개</h2></div></div>
    <div class="prose">
      <p style="font-family:var(--display);font-size:clamp(22px,2.6vw,28px);font-weight:600;line-height:1.6;letter-spacing:-.01em">선생님이 수업에 그대로 가져갈 수 있는 책, 학생이 혼자서도 끝까지 풀 수 있는 책을 만듭니다.</p>
      <p>ENK Books(이엔케이북스)는 영어 교육 전문 출판사입니다. 교재마다 음원과 해설, 수업용 자료를 함께 만들어 자료실에서 무료로 제공합니다. 이 소개 문구는 예시이니 실제 회사 이야기로 바꿔 주세요.</p>
      <dl class="spec"><dt>출판 분야</dt><dd>초등 영어 · 중등 문법 · 고등 독해 · 어휘 · 수능</dd><dt>출간 도서</dt><dd>${BOOKS.length}종 (예시)</dd><dt>연락처</dt><dd>등록 후 기재 예정</dd></dl>
    </div>`;
  }
};

function board(items, withBook){
  return `<ul class="board">${items.map(i=>`<li><b>${withBook?`<span class="tag">${esc(i.book)}</span> `:''}${esc(i.title)}</b><time>${i.date}</time></li>`).join("")}</ul>`;
}
function resTable(rows, showBook){
  if(!rows.length) return `<p class="note">해당하는 자료가 없습니다.</p>`;
  return `<div class="table-wrap"><table><thead><tr>${showBook?'<th>도서</th>':''}<th>자료</th><th>형식</th><th>용량</th><th>대상</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr>${showBook?`<td><a href="#book-${r.book.id}">${esc(r.book.title)}</a></td>`:''}<td>${esc(r.name)}</td><td><span class="ftype">${r.type}</span></td><td class="num">${r.size}</td>
    <td>${r.access==="teacher"?'<span class="lock">교사 회원</span>':'<span class="lock">누구나</span>'}</td>
    <td>${r.url?`<a class="dl" href="${esc(r.url)}" target="_blank" rel="noopener">받기</a>`:`<button class="dl" type="button" disabled title="파일 등록 전입니다">준비 중</button>`}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ================= 라우팅 ================= */
const state = { cat:"전체", q:"", stage:"" };
function route(){
  const h = location.hash.slice(1) || "home";
  let name = h, arg;
  if(h.startsWith("book-")){ name="book"; arg=h.slice(5); }
  if(!views[name]) name="home";
  $("#app").innerHTML = views[name](arg);
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+(name==="book"?"books":name)));
  window.scrollTo(0,0);
  if(name==="home") bindHome();
  if(name==="books") bindCatalog();
  if(name==="resources") bindResources();
}
let slideTimer;
function bindHome(){
  const go = i => { document.querySelectorAll(".slide").forEach(s=>s.classList.toggle("on",+s.dataset.i===i)); document.querySelectorAll("#dots button").forEach(d=>d.classList.toggle("on",+d.dataset.go===i)); home.i=i; };
  const home = {i:0}, n = document.querySelectorAll(".slide").length;
  $("#dots").onclick = e => { const d=e.target.closest("[data-go]"); if(d){ go(+d.dataset.go); clearInterval(slideTimer); } };
  clearInterval(slideTimer);
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches) slideTimer = setInterval(()=>go((home.i+1)%n), 6000);
}
function bindCatalog(){
  const draw = () => {
    const q = state.q.trim().toLowerCase().replace(/-/g,"");
    let list = BOOKS.filter(b => (!state.stage||b.level.startsWith(state.stage)) && (state.cat==="전체"||b.cat===state.cat) && (!q || b.title.toLowerCase().includes(q) || b.isbn.replace(/-/g,"").includes(q)));
    const s = $("#sort").value;
    list.sort(s==="title"?(a,b)=>a.title.localeCompare(b.title,"ko"):s==="price"?(a,b)=>a.price-b.price:(a,b)=>b.date.localeCompare(a.date));
    $("#list").innerHTML = list.map(card).join("") || `<p class="note">조건에 맞는 교재가 없습니다.</p>`;
    $("#count").textContent = `${list.length}종`;
  };
  $("#stages").onclick = e => { const b=e.target.closest("[data-s]"); if(!b) return; state.stage=b.dataset.s; state.cat="전체"; document.querySelectorAll("#stages button").forEach(x=>x.classList.toggle("on",x===b)); document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on",x.dataset.c==="전체")); draw(); };
  $("#filters").onclick = e => { const c=e.target.dataset.c; if(!c) return; state.cat=c; document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("on",b.dataset.c===c)); draw(); };
  $("#q").oninput = e => { state.q=e.target.value; draw(); };
  $("#sort").onchange = draw;
  draw();
}
function bindResources(){
  const draw = () => {
    const bk=$("#rbook").value, tp=$("#rtype").value;
    const rows = BOOKS.filter(b=>!bk||b.id===bk).flatMap(b=>b.resources.filter(r=>!tp||r.type===tp).map(r=>({...r,book:b})));
    $("#rlist").innerHTML = resTable(rows, true);
  };
  $("#rbook").onchange = draw; $("#rtype").onchange = draw;
}

document.addEventListener("click", e => {
  const cat = e.target.closest("[data-cat]"); if(cat) state.cat = cat.dataset.cat;
  const st = e.target.closest("[data-stage]"); if(st) { state.cat="전체"; state.q=""; state.stage=st.dataset.stage; }
  const tab = e.target.closest("[data-tab]");
  if(tab){ document.querySelectorAll("[data-tab]").forEach(t=>t.classList.toggle("on",t===tab)); document.querySelectorAll("[data-pane]").forEach(p=>p.hidden=p.dataset.pane!==tab.dataset.tab); }
  const add = e.target.closest("[data-add]");
  if(add){ cart.push(add.dataset.add); saveCart(); toast(SITE.shop.enabled?"장바구니에 담았습니다.":"장바구니에 담았습니다. 결제 기능은 준비 중입니다."); }
});
$("#cartBtn").onclick = () => toast(cart.length ? `장바구니에 ${cart.length}권이 있습니다. 결제 기능은 준비 중입니다.` : "장바구니가 비어 있습니다.");
document.addEventListener("submit", e => { if(e.target.id==="ask"){ e.preventDefault(); e.target.reset(); toast("문의가 등록되었습니다. (미리보기라 실제 전송되지 않습니다)"); } });

window.addEventListener("hashchange", route);
saveCart(); route();
</script>
</body>
</html>
